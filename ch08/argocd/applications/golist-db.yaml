apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golist-db
  namespace: argocd
spec:
  source:
    helm:
      parameters:
        - name: architecture
          value: "standalone"
        - name: auth.database
          value: "golist"
        - name: auth.username
          value: "golist"
        # Provision this Secret separately; keep credentials stable across syncs.
        - name: auth.existingSecret
          value: "golist-db-credentials"
        - name: image.repository
          value: bitnamilegacy/mariadb
        - name: image.tag
          value: 10.6.18-debian-12-r0
    chart: mariadb
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: 11.1.0
  destination:
    namespace: golist
    server: 'https://kubernetes.default.svc'
  project: golist
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2
    syncOptions:
      - CreateNamespace=true
